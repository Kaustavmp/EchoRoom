version: "3.9"

# EchoRoom – Docker Compose
# Spins up: bot API server, Redis (session state), Nginx reverse proxy.
#
# Usage:
#   cp .env.example .env      # fill in API keys
#   docker compose up -d

services:

  # ── EchoRoom API (bot + transcription + intelligence) ─────────────────
  echoroom:
    build: .
    image: echoroom:latest
    container_name: echoroom-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - HF_TOKEN=${HF_TOKEN:-}
      - REDIS_URL=redis://redis:6379/0
      - PULSE_SERVER=unix:/run/user/1000/pulse/native
    volumes:
      - audio_chunks:/app/audio_chunks
      - ./logs:/app/logs
    shm_size: "2gb"           # Chromium needs generous shared memory
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Redis – lightweight session & queue store ──────────────────────────
  redis:
    image: redis:7-alpine
    container_name: echoroom-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Nginx – reverse proxy + HTTPS termination ──────────────────────────
  nginx:
    image: nginx:alpine
    container_name: echoroom-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro    # mount your SSL certs here
    depends_on:
      - echoroom

volumes:
  audio_chunks:
  redis_data:
